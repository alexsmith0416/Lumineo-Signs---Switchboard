"Screen1 As screen.'autoLayout_HeaderFooter_ver1.0'":
    Fill: =RGBA(250, 250, 251, 1)
    LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    OnVisible: |-
        =// Responsive sizing — assumes gblDesignW = 1280 from App.OnStart
        Set(gblContentW, Min(App.Width - 40, gblDesignW));
        Set(gblContentX, (App.Width - gblContentW) / 2);
        Set(gblIsDesktop, gblContentW >= 900);
        Set(gblIsTablet,  gblContentW >= 560 && gblContentW < 900);
        Set(gblIsPhone,   gblContentW < 560);

        // Refresh Dataverse so KPI cards pick up the latest snapshot rows
        Refresh('lum_kpisnapshot');

        // Safety counter — singleton row from lum_safetymetric
        Set(varSafety, First('lum_safetymetric'));
        Set(varSafetyDays,
            If(IsBlank(varSafety),
                247,    // fallback for demo before the singleton exists
                DateDiff(varSafety.currentStreakStartDate, Today(), Days)
            )
        );
        Set(varSafetyRecord, Coalesce(varSafety.longestStreakDays, 412));

        // Department load — colored by dept (Production navy, Installation red, Shipping green)
        Set(varDeptLoad, Table(
            { label: "Production",   hours: 142, tone: RGBA(20, 20, 100, 1) },
            { label: "Installation", hours: 98,  tone: RGBA(232, 21, 27, 1) },
            { label: "Shipping",     hours: 67,  tone: RGBA(15, 110, 86, 1) }
        ));
        Set(varDeptLoadMax, Max(varDeptLoad, hours));

        // Late tasks — Dataverse query with static seed fallback for demo
        Set(varLateTasks,
            With({ live: Filter('lum_task',
                status <> "Done" && scheduledDate < Today()
            )},
                If(CountRows(live) > 0,
                    live,
                    Table(
                        { title: "Pylon refurb — fabrication", jobNumber: "J123478", assignedTo: "Marcus L.", department: "Production",   daysLate: 2 },
                        { title: "Channel letters — paint",     jobNumber: "J123456", assignedTo: "Hunter B.", department: "Production",   daysLate: 1 },
                        { title: "Site survey — Westfield",     jobNumber: "J123512", assignedTo: "Aiden P.",  department: "Installation", daysLate: 3 },
                        { title: "Crate & label — Sunoco LED",  jobNumber: "J123488", assignedTo: "Priya D.",  department: "Shipping",     daysLate: 1 }
                    )
                )
            )
        );

        // Pending approvals — spec + quote union with static fallback
        Set(varPendingApprovals, Table(
            { title: "Hartford Med — backlit channel spec", kind: "SPEC",  amount: 18400, waiting: "2d", source: "Sign Builder" },
            { title: "Westfield Mall — monument quote",      kind: "QUOTE", amount: 84000, waiting: "1d", source: "Sales Hub" },
            { title: "Route 9 pylon — refurb scope",          kind: "SPEC",  amount: 12200, waiting: "4h", source: "Sign Builder" }
        ))

