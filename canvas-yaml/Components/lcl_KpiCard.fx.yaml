lcl_KpiCard As CanvasComponent:
    AccentColor: |-
        ="#141464"
    CompHeight: =92
    CompWidth: =260
    Fill: =RGBA(0, 0, 0, 0)
    Height: =92
    kpiKey: =""
    Subtitle: =""
    Title: ="Loading..."
    Value: ="—"
    Width: =260
    X: =0
    Y: =0
    ZIndex: =1

    kpiRectBG As rectangle:
        BorderColor: =gblBrand.border
        BorderThickness: =1
        DisabledFill: =gblBrand.bg2
        Fill: =gblBrand.card
        FocusedBorderThickness: =1
        Height: =lcl_KpiCard.CompHeight
        HoverFill: =gblBrand.navySoft
        PressedFill: =gblBrand.navyMid
        Width: =lcl_KpiCard.CompWidth
        ZIndex: =1

    kpiRectTopBar As rectangle:
        BorderColor: =RGBA(0, 0, 0, 0)
        BorderStyle: =BorderStyle.None
        DisabledFill: =gblBrand.border
        Fill: =ColorValue(lcl_KpiCard.AccentColor)
        FocusedBorderThickness: =1
        Height: =3
        HoverFill: =ColorValue(lcl_KpiCard.AccentColor)
        PressedFill: =ColorValue(lcl_KpiCard.AccentColor)
        Width: =lcl_KpiCard.CompWidth
        ZIndex: =2

    kpiLblTitle As label:
        BorderColor: =RGBA(0, 0, 0, 0)
        BorderStyle: =BorderStyle.None
        Color: =gblBrand.textDim
        DisabledColor: =gblBrand.textDim
        FocusedBorderThickness: =1
        FontWeight: =FontWeight.Bold
        Height: =14
        PaddingBottom: =0
        PaddingLeft: =0
        PaddingRight: =0
        PaddingTop: =0
        Size: =9
        Text: |-
            =With(
                {_r: LookUp('lum_kpisnapshot', lum_key = lcl_KpiCard.kpiKey And lum_audience = gblUser.role)},
                Upper(Coalesce(_r.lum_label, lcl_KpiCard.Title))
            )
        Width: =lcl_KpiCard.CompWidth - 24
        X: =12
        Y: =12
        ZIndex: =3

    kpiLblValue As label:
        BorderColor: =RGBA(0, 0, 0, 0)
        BorderStyle: =BorderStyle.None
        Color: =gblBrand.text
        DisabledColor: =gblBrand.textDim
        FocusedBorderThickness: =1
        FontWeight: =FontWeight.Bold
        Height: =28
        PaddingBottom: =0
        PaddingLeft: =0
        PaddingRight: =0
        PaddingTop: =0
        Size: =20
        Text: |-
            =With(
                {_r: LookUp('lum_kpisnapshot', lum_key = lcl_KpiCard.kpiKey And lum_audience = gblUser.role)},
                If(IsBlank(_r),
                    lcl_KpiCard.Value,
                    Switch(_r.lum_valueformat,
                        "currency", "$" & Text(_r.lum_value, "[$-en-US]#,##0"),
                        "int", Text(_r.lum_value, "#,##0"),
                        "percent", Text(_r.lum_value, "#,##0.0") & "%",
                        "hours", Text(_r.lum_value, "#,##0") & " h",
                        "days", Text(_r.lum_value, "#,##0"),
                        Text(_r.lum_value)
                    )
                )
            )
        Width: =lcl_KpiCard.CompWidth - 24
        X: =12
        Y: =28
        ZIndex: =4

    kpiLblDelta As label:
        BorderColor: =RGBA(0, 0, 0, 0)
        BorderStyle: =BorderStyle.None
        Color: |-
            =With(
                {_r: LookUp('lum_kpisnapshot', lum_key = lcl_KpiCard.kpiKey And lum_audience = gblUser.role)},
                If(IsBlank(_r),
                    gblBrand.textDim,
                    Switch(_r.lum_deltadirection,
                        "flat", gblBrand.textDim,
                        If(_r.lum_deltaisgood, gblBrand.green, gblBrand.red)
                    )
                )
            )
        DisabledColor: =gblBrand.textDim
        FocusedBorderThickness: =1
        FontWeight: =FontWeight.Bold
        Height: =14
        PaddingBottom: =0
        PaddingLeft: =0
        PaddingRight: =0
        PaddingTop: =0
        Size: =10
        Text: |-
            =With(
                {_r: LookUp('lum_kpisnapshot', lum_key = lcl_KpiCard.kpiKey And lum_audience = gblUser.role)},
                If(IsBlank(_r),
                    "",
                    Switch(_r.lum_deltadirection,
                        "up",   "▲ ",
                        "down", "▼ ",
                        "▬ "
                    )
                    & Text(Abs(Coalesce(_r.lum_deltavalue, 0)), "#,##0.#")
                    & If(_r.lum_valueformat = "percent", " pp", "%")
                )
            )
        Width: =lcl_KpiCard.CompWidth - 24
        X: =12
        Y: =58
        ZIndex: =5

    kpiLblSubtitle As label:
        BorderColor: =RGBA(0, 0, 0, 0)
        BorderStyle: =BorderStyle.None
        Color: =gblBrand.textMid
        DisabledColor: =gblBrand.textDim
        FocusedBorderThickness: =1
        Height: =12
        PaddingBottom: =0
        PaddingLeft: =0
        PaddingRight: =0
        PaddingTop: =0
        Size: =9
        Text: =lcl_KpiCard.Subtitle
        Visible: =!IsBlank(lcl_KpiCard.Subtitle)
        Width: =lcl_KpiCard.CompWidth - 24
        X: =12
        Y: =76
        ZIndex: =6
